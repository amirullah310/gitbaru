<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfaiz</title>
    <style>
    #container{
        height: 705px;
        width: 100%;
    }
    </style>
</head>
<body id="container">


    <script>
        let lampu = document.getElementById("container");
        setInterval(function(){
            lampu.style.backgroundImage="linear-gradient(to bottom right, #4682B4, #00FFFF, #00FA9A)";
            setTimeout(function(){
                lampu.style.backgroundImage="linear-gradient(to bottom left, #0CCAD3, #C1FCD3)";
            },300);
        },500);
    </script>
</body>
</html>
